<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Round Container -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Outer Gradient Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)" opacity="0.9" />
  
  <!-- Inner Sparkle Star -->
  <path d="M32 18 L34.5 28.5 L45 31 L34.5 33.5 L32 44 L29.5 33.5 L19 31 L29.5 28.5 Z" fill="url(#grad)" filter="url(#glow)" />
</svg>